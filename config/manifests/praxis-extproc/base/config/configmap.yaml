apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  # Pre-auth (BBR) Praxis chain: promote body model to a routing header, then
  # rewrite publisher IDs in the JSON body for KServe upstream routing.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          - filter: headers
            request_remove:
              - X-Gateway-Model-Name
          - filter: json_body
            request_extract:
              - pointer: /model
                header: X-Gateway-Model-Name
            on_invalid: continue
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true

  # Post-auth (IPP) Praxis chain: full processing pipeline.
  #
  # When the controller is started with --metering-url (or METERING_URL), it
  # prepends the MaaS metering filters to this chain at render time:
  #   - filter: identity_header_guard   # capture+strip x-maas-* into metadata
  #   - filter: external_metering        # emit maas-gateway usage CloudEvents
  # Metering lives here (post-auth), not in the BBR chain, because the x-maas-*
  # identity headers are injected by Authorino after BBR and billing needs the
  # response path. See issue #99 and pkg/tenant/extproc.go.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: ipp
        filters:
          - filter: request_id

    insecure_options:
      allow_unbounded_body: true
